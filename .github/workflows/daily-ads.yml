# Builds a fresh batch of free-audit ads every morning, keeps the images and
# spreadsheet as a downloadable artifact, and (when Meta secrets are set)
# uploads them to your ad set as PAUSED ads for review.
#
# Runs once per brand. Settings ending in _MIDAMERICA or _BOLDFORM apply to that brand only.
#   Secrets:   ANTHROPIC_API_KEY (fresh Claude copy, shared)
#              META_ACCESS_TOKEN_<BRAND>, META_AD_ACCOUNT_ID_<BRAND>, META_PAGE_ID_<BRAND>,
#              META_LEAD_FORM_ID_<BRAND> (optional)
#   Variables: AD_BRANDS_ENABLED (e.g. "midamerica,boldform"; default midamerica only),
#              AD_DAILY_COUNT (default 100), AD_INDUSTRIES (default all),
#              AD_CITIES_<BRAND> (e.g. "Belleville, IL;O'Fallon, IL"), META_ADSET_ID_<BRAND>
name: Daily ad batch

on:
  schedule:
    - cron: '47 11 * * *' # 6:47am Central (11:47 UTC during daylight time)
  workflow_dispatch:
    inputs:
      count:
        description: How many ads
        default: '100'
      brand:
        description: Brand
        type: choice
        options: [midamerica, boldform]
        default: midamerica
      industries:
        description: Industries (comma separated, or all)
        default: all
      upload:
        description: Upload to Meta as paused ads
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  brands:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        # Manual runs build the chosen brand; scheduled runs build every enabled brand.
        env:
          CHOSEN: ${{ github.event_name == 'workflow_dispatch' && inputs.brand || vars.AD_BRANDS_ENABLED || 'midamerica' }}
        run: |
          json=$(echo "$CHOSEN" | tr ',' '\n' | sed 's/ //g' | grep -E '^(midamerica|boldform)$' \
            | awk '{printf "%s{\"brand\":\"%s\",\"suffix\":\"%s\"}", (NR>1?",":""), $1, toupper($1)}')
          echo "matrix={\"include\":[$json]}" >> "$GITHUB_OUTPUT"

  generate:
    needs: brands
    strategy:
      fail-fast: false
      max-parallel: 1 # one brand at a time, so the history commits don't race
      matrix: ${{ fromJSON(needs.brands.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ads/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate ads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node generate.js --brand "${{ matrix.brand }}" \
            --count "${{ inputs.count || vars.AD_DAILY_COUNT || '100' }}" \
            --industries "${{ inputs.industries || vars.AD_INDUSTRIES || 'all' }}" \
            --cities "${{ vars[format('AD_CITIES_{0}', matrix.suffix)] }}" \
            --ai --ai-share 0.6 \
            --out ../out/ads/batch
      - uses: actions/upload-artifact@v4
        with:
          name: ads-${{ matrix.brand }}-${{ github.run_number }}
          path: out/ads/batch
          retention-days: 30
      - name: Upload to Meta (paused)
        if: ${{ github.event_name == 'schedule' || inputs.upload }}
        env:
          META_ACCESS_TOKEN: ${{ secrets[format('META_ACCESS_TOKEN_{0}', matrix.suffix)] }}
          META_AD_ACCOUNT_ID: ${{ secrets[format('META_AD_ACCOUNT_ID_{0}', matrix.suffix)] }}
          META_PAGE_ID: ${{ secrets[format('META_PAGE_ID_{0}', matrix.suffix)] }}
          META_LEAD_FORM_ID: ${{ secrets[format('META_LEAD_FORM_ID_{0}', matrix.suffix)] }}
          ADSET: ${{ vars[format('META_ADSET_ID_{0}', matrix.suffix)] }}
        run: |
          if [ -z "$META_ACCESS_TOKEN" ] || [ -z "$ADSET" ]; then
            echo "Meta settings for ${{ matrix.brand }} not set; skipping upload."
          else
            node upload-meta.js ../out/ads/batch --adset "$ADSET" --live
          fi
      - name: Save ad history so tomorrow's batch never repeats an ad
        run: |
          git config user.name "ad-batch-bot"
          git config user.email "ad-batch-bot@users.noreply.github.com"
          git add "history-${{ matrix.brand }}.jsonl"
          git commit -m "Record ${{ matrix.brand }} ad batch ${{ github.run_number }}" || echo "Nothing to record"
          git pull --rebase --autostash
          git push
